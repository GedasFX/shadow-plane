[package]
name = "shadow-plane"
version = "0.1.1"
edition = "2024"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-dialog = "2.8.4"
# SQLite built in: no system library on the machines it runs on.
rusqlite = { version = "0.41.1", features = ["bundled"] }
# generate_context! names it once the config has a plugin section.
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
