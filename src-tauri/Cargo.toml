[package]
name = "shadow-plane"
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-dialog = "2.8.4"
# Opens a finished clip in the default video player.
tauri-plugin-opener = "2.7.2"
# SQLite built in: no system library on the machines it runs on.
rusqlite = { version = "0.41.1", features = ["bundled"] }
# generate_context! names it once the config has a plugin section.
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Local time for a video's date; a file name's dates are read with regular expressions.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
# A media URL's path arrives percent-encoded.
percent-encoding = "2"
# Compares a video's copy with the original before the original goes.
sha1 = "0.10"

# The kill-on-close job every encode joins.
[target.'cfg(windows)'.dependencies]
win32job = "2.0.3"

[dev-dependencies]
tempfile = "3"
